# H2 in-memory database: created when the app starts, wiped when it stops
spring.datasource.url=jdbc:h2:mem:klokin
spring.datasource.username=sa
spring.datasource.password=
# Hibernate builds the tables from our entities on startup and drops them on shutdown
spring.jpa.hibernate.ddl-auto=create-drop
# Prints the SQL Hibernate runs, handy for learning and debugging
spring.jpa.show-sql=true
